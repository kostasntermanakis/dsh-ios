# Builds an UNSIGNED DSH.ipa for sideloading (Sideloadly / Impactor / AltStore re-sign it).
# Put this file in your fork at: .github/workflows/build-ipa.yml
name: build-ipa
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26             # Apple Silicon runner (the guest build needs arm64 macOS)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest Xcode (README asks for Xcode 27)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build tools
        run: |
          brew install meson ninja lld
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          sudo gem install xcodeproj

      - name: Cache guest image
        uses: actions/cache@v4
        with:
          path: build/root.tar.gz
          key: rootfs-${{ hashFiles('scripts/build-rootfs.sh', 'rootfs/**') }}

      - name: Build emulator + guest image
        run: |
          make emulator
          [ -f build/root.tar.gz ] || make rootfs

      - name: Drop entitlements a free Apple ID can't sign (HealthKit, Private Cloud Compute)
        run: |
          cat > app/DSH.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict/></plist>
          EOF

      - name: Build app (unsigned)
        run: |
          make project
          xcodebuild -project DSH.xcodeproj -scheme DSH -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DSH_DEVELOPMENT_TEAM="" build

      - name: Package .ipa
        run: |
          mkdir -p out/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/DSH.app out/Payload/
          cd out && zip -qry DSH.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DSH-ipa
          path: out/DSH.ipa
